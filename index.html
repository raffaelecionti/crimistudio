<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crimi Studio | Studio di registrazione</title>
  <meta name="description" content="Crimi Studio, studio di registrazione.">
  <meta name="theme-color" content="#050608">
  <meta name="color-scheme" content="dark">

  <!--google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Archivo+Black&display=swap" rel="stylesheet">

  <!--css style-->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!--navbar-->
  <header class="nav" id="nav">
    <a class="nav-brand" href="#top">CRIMI STUDIO</a>

    <nav class="nav-links" id="navLinks" aria-label="Menu principale">
      <a href="./info.html">Informazioni</a>
      <a href="./contact.html">Contatti</a>
    </nav>

    <!-- Tasto Prenota ora visibile di fianco all'hamburger su mobile -->
    <a class="btn-cream btn-nav" href="./prenota.html">Prenota ora</a>

    <!--hamburger: visibile solo su mobile-->
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="navLinks">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main id="top">
    <!--
      Il "track" è alto 2 schermi: la hero resta fissa (sticky) mentre
      scorri, e lo script chiude il video dal basso rivelando la fascia
      nera con la scritta che scorre e il pulsante.
    -->
    <div class="hero-track" id="heroTrack">
      <section class="hero" id="hero" aria-label="Crimi Studio">

        <!--fascia nera sotto il video: si scopre scorrendo-->
        <div class="hero-bottom">
          <div class="marquee" aria-hidden="true">
            <div class="marquee-track">
              <span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span>
              <span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span><span>PRENOTA UNA SESSIONE</span>
            </div>
          </div>
          <a class="btn-cream btn-wide" href="./prenota.html">Prenota una sessione</a>
        </div>

        <!--video + logo: questo blocco viene ritagliato dal basso allo scroll-->
        <div class="hero-media" id="heroMedia">
          <video class="hero-video" id="heroVideo" autoplay muted loop playsinline webkit-playsinline preload="metadata" disablepictureinpicture poster="./media/hero-poster.jpg" aria-hidden="true">
            <source src="./media/hero.mp4" type="video/mp4">
            <source src="./media/hero.webm" type="video/webm">
          </video>
          <div class="hero-shade" aria-hidden="true"></div>

          <h1 class="hero-logo-wrap" id="heroLogo">
            <!-- rinomina il file "logo (1).png" in "logo.png" -->
            <img class="hero-logo" src="./media/logo.png" alt="Crimi Studio" width="799" height="255" decoding="async">
          </h1>

          <a class="scroll-cue" href="#fine" aria-label="Scorri">
            <span>SCORRI</span>
            <i></i>
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer" id="fine">
    <p>CRIMI STUDIO</p>
  </footer>

  <!--menu mobile script-->
  <script>
    (function () {
      var nav = document.getElementById('nav');
      var toggle = document.getElementById('navToggle');
      var links = document.getElementById('navLinks');
      if (!nav || !toggle || !links) return;

      function setOpen(open) {
        toggle.classList.toggle('is-active', open);
        links.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Chiudi il menu' : 'Apri il menu');
        document.body.style.overflow = open ? 'hidden' : '';
      }

      toggle.addEventListener('click', function () {
        setOpen(!links.classList.contains('is-open'));
      });

      // chiudi quando tocchi un link, premi Esc o tocchi fuori dal menu
      links.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
      document.addEventListener('click', function (e) {
        if (!nav.contains(e.target)) setOpen(false);
      });
      window.addEventListener('resize', function () {
        if (window.innerWidth > 859.98) setOpen(false);
      });
    })();
  </script>

  <!--js del sito-->
  <script src="script.js"></script>
</body>
</html>
